services:
  fusionpbx-bridge:
    build: .
    container_name: fusionpbx-bridge
    restart: unless-stopped
    ports:
      - "127.0.0.1:8880:8880"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_NAME: fusionpbx
      DB_USER: fusionpbx
      DB_PASS: ${DB_PASS}
      API_KEY: ${API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # With the key. Every route is behind it, /health included, so an
      # unauthenticated check answers 401 for ever: on s01 this had failed 6,012
      # times in a row against a bridge that was serving Phoneus perfectly well,
      # which taught everyone to read "unhealthy" as normal.
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $$API_KEY\" http://localhost:8880/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
